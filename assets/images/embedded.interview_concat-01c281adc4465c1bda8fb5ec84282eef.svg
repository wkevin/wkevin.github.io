' skinparam monochrome true
<style>
mindmapDiagram {
  arrow {
    LineStyle 1
    ' LineThickness 0.5
    LineColor gray
  }
  node {
    BackgroundColor white
    LineColor black
    Padding 28
  }
  :depth(0) {
    BackGroundColor lightblue
    FontSize 22
    'HorizontalAlignment center
  }
  :depth(1) {
    BackGroundColor lightGreen
    FontSize 20
  }
  boxless {
    ' Margin 3
    ' FontSize 10
  }
}
</style>

