@startmindmap

' skinparam monochrome true
<style>
mindmapDiagram {
  arrow {
    LineStyle 1
    ' LineThickness 0.5
    LineColor gray
  }
  node {
    BackgroundColor white
    LineColor black
    Padding 28
  }
  :depth(0) {
    BackGroundColor lightblue
    FontSize 22
    'HorizontalAlignment center
  }
  :depth(1) {
    BackGroundColor lightGreen
    FontSize 20
  }
  boxless {
    ' Margin 3
    ' FontSize 10
  }
}
</style>

skinparam roundCorner 15

+ 内建\n扩展\ntype
++ 重置 type
+++_ type Partial<T> = { [P in keyof T]?: T[P]; } // 将属性变成可选的
+++_ type Required<T> = { [P in keyof T]-?: T[P]; }; // 将属性变成必选的
++ 过滤、筛选 type
+++_ type Readonly<T> = { readonly [P in keyof T]: T[P]; } // 筛出只读属性的 T 的子集
+++_ type NonNullable<T> = T extends null | undefined ? never : T; // 筛出非空的 T 的子集
+++_ type Pick<T, K extends keyof T> = { [P in K]: T[P]; } // 取 T 中 K 指定的部分 T 的子集
+++_ type Exclude<T, U> = T extends U ? never : T; // T、U 为集合，得到 T 中排除 U 后 T 的子集（T 非集）
+++_ type Extract<T, U> = T extends U ? T : never; // T、U 为集合，取 T、U 共集
+++_ type Omit<T, K extends keyof any> = Pick<T, Exclude<keyof T, K>>; // Pick T 非集（不还是 T 非集么？）
++ 新建 type
+++_ type Record<K extends keyof any, T> = { [P in K]: T; } // K 作 key，T 作 value
++ 从函数type中提取信息\n制作新 type
+++ 提取入参
++++_ type ThisParameterType<T>
++++_ type OmitThisParameter<T>
++++_ type Parameters<T extends (...args: any) => any>
++++_ type ConstructorParameters<T extends abstract new (...args: any) => any>
+++ 提取返回值
++++_ type ReturnType<T extends (...args: any) => any>
++++_ type InstanceType<T extends abstract new (...args: any) => any>
++ 加工字符串字面量 type 制作新 type
+++_ type Uppercase<S extends string> = intrinsic;
+++_ type Lowercase<S extends string> = intrinsic;
+++_ type Capitalize<S extends string> = intrinsic;
+++_ type Uncapitalize<S extends string> = intrinsic;
@endmindmap

