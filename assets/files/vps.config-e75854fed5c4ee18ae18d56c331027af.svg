@startuml
' skinparam monochrome true
<style>
mindmapDiagram {
  arrow {
    LineStyle 1
    ' LineThickness 0.5
    LineColor gray
  }
  node {
    BackgroundColor white
    LineColor black
    Padding 28
  }
  :depth(0) {
    BackGroundColor lightblue
    FontSize 22
    'HorizontalAlignment center
  }
  :depth(1) {
    BackGroundColor lightGreen
    FontSize 20
  }
  boxless {
    ' Margin 3
    ' FontSize 10
  }
}
</style>

participant Jenkins as J
participant Gitee as G

note left J
《安装插件》
Manage Jenkins ->
Install Plugins ->
Search "Gitee" ->
Install
end note

note left J
《配置插件》
Jenkins ->
Manage Jenkins ->
Configure System ->
Gitee Configuration ->
Gitee connections

Connection name = ((Gitee))
Gitee host URL = https://gitee.com
Credentials : Add - ->
end note

note right G
《生成连接  token》
https://gitee.com/personal_access_tokens
此 token 不用于源码管理的凭据，
只用于 gitee 插件的 API 调用凭据。
end note

G -> J: 【连接 token】

note left J
《配置插件》- -《创建连接》
Domain = Global...
Kind = Gitee API Token
Gitee APIV5 Token = 【连接 token】
ID = 随意
Description = 随意

Test Connection: Success 再继续
end note

note left J
《配置 Job》
Job - - config
Gitee connection = ((Gitee))
Build Triggers：
  Build when a change is pushed to Gitee...
    很多修改项，可参考文档
找到 【webhook 地址、token】
该 token 是 jenkins 中生成的
end note

J -> G: 【webhook 地址、token】

note right G
《项目配置》
WebHooks 管理 = 【webhook 地址、token】
Test
end note

G -> J: 向 webhook 发送 token

note over J: 触发 Job

J <-> G: 使用【连接 token】git pull 源码
@enduml

